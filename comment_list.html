<script>
function register(){
var phone = $('#phone').val();
if(phone == null || phone == '')
{
alert("手机号不能为空！");
return;
}
var code = $('#code').val();
if(code == null || code == '')
{
alert("验证码不能为空！");
return;
}
$.ajax({
type: "POST", // 用POST方式传输
dataType: "text", // 数据格式:JSON
url: "/register.html", // 目标地址
data: "phone=" + phone +"&code="+code,
success: function (data){
jsonObj = $.parseJSON(data);
if(jsonObj.code == 1)
{
if (jsonObj.user_uri != null && jsonObj.user_uri != '')
{
window.location.href= jsonObj.user_uri; //验证成功
}else
{
window.location.href='index.html'; //验证成功
}
}
else if(jsonObj.code == 0)
{
$("#jbPhoneTip").html("<font color='red'>× 校验失败，如需帮助，请联系系统管理员。</font>");
}
}
});
}
var isPhone = 1;
var isName = 1;
var isCity = 1;
var isWorkInfo = 1;
//验证手机号码
function checkPhone(){
var phone = $('#phone').val();
var pattern = /^1[0-9]{10}$/;
isPhone = 1;
if(phone == '') {
alert('请输入手机号码');
isPhone = 0;
return;
}
if(!pattern.test(phone)){
alert('请输入正确的手机号码');
isPhone = 0;
return;
}
}
//自己编写的功能
var InterValObj; //timer变量，控制时间
var count = 30; //间隔函数，1秒执行
var curCount;//当前剩余秒数
function send()
{
checkPhone();
if(isPhone){
sendMessage(); //倒计时
}else{
$('#phone').focus();
}
}
function sendMessage()
{
curCount = count;
// 设置button效果，开始计时
document.getElementById("btnSendCode").setAttribute("disabled","true" );//设置按钮为禁用状态
document.getElementById("btnSendCode").value="请在" + curCount + "后再次获取";//更改按钮文字
InterValObj = window.setInterval(SetRemainTime, 1000); // 启动计时器timer处理函数，1秒执行一次
var phone = $('#phone').val();
// 向后台发送处理数据
$.ajax({
type: "POST", // 用POST方式传输
dataType: "text", // 数据格式:JSON
url: "/mobile.html", // 目标地址
data: "mobile="+phone,
success: function (data){
//data = parseInt(data, 10);
jsonObj = $.parseJSON(data);
if(jsonObj.code == 1)
{
<!--$("#jbPhoneTip").html("<font color='#339933'>√ 短信验证码已发到您的手机，短信签名：面试天下网，请查收！</font>");-->
$("#jbPhoneTip").html("<font color='#339933'>√ 短信验证码为您手机号码的后四位，请您直接输入即可！</font>");
<!--alert(jsonObj.msg);-->
}
else if(jsonObj.code == 2)
{
$("#jbPhoneTip").html("<font color='red'>× 短信验证码发送频繁，请稍后再试！</font>");
}
else if(jsonObj.code == 3)
{
$("#jbPhoneTip").html("<font color='red'>× 此手机号已经被占用，无法注册！</font>");
}
else{
$("#jbPhoneTip").html("<font color='red'>× 短信验证码发送失败，请重新发送！</font>");
}
}
});
}
//timer处理函数
function SetRemainTime()
{
if (curCount == 0)
{
window.clearInterval(InterValObj);// 停止计时器
document.getElementById("btnSendCode").removeAttribute("disabled");//移除禁用状态改为可用
document.getElementById("btnSendCode").value="重新发送验证码";
$("#jbPhoneTip").html("");
}
else
{
curCount--;
document.getElementById("btnSendCode").value="请在" + curCount + "秒后再次获取";
}
}
</script>
