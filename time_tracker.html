<body>
<div class="container">
<h1>
✍️ 衡水体练习时间记录器 · 固定时间 · 量变引发质变
</h1>
<br />
<div class="notice">
🔊 提醒：每天10-15分钟刻意练习，不是随便抄写，要一边写一边对照标准。 🔥人气：1178+
</div>
<div class="subtitle">
记录格式：<strong>日期，分钟，内容</strong> （例如：2026年7月1日，15分钟，练习衡水体）
</div>
<!-- 上半部分：输入框 -->
<div class="input-section">
<div style="display: flex; align-items: center; flex-wrap: wrap;">
<label for="logInput">✍️ 学习记录</label>
<span class="save-indicator" id="saveIndicator">💾 已自动保存</span>
</div>
<textarea id="logInput"
placeholder="2026年7月1日，10分钟，学习了衡水体知识。&#10;2026年7月2日，15分钟，继续学习了衡水体知识。&#10;2026年7月3日，20分钟，复习衡水体知识。"></textarea>
<div class="format-hint">
<span>💡</span> 每条记录一行，使用中文逗号“，”分隔日期、分钟数和描述。
</div>
</div>
<!-- 下半部分：按钮与图表区域 -->
<div class="action-row">
<button class="btn-generate" id="generateChartBtn">
<span>📈</span> 生成学习时长折线图
</button>
<button class="btn-clear" id="clearDataBtn">
<span>🗑️</span> 清除本地数据
</button>
</div>
<!-- 图表显示区 -->
<div class="chart-container" id="chartContainer">
<canvas id="studyChart" width="400" height="200"></canvas>
<div id="fallbackMessage" class="no-data-message" style="display: none;"></div>
</div>
<!-- 统计信息 -->
<div id="statsInfo" class="stats-row" style="display: none;">
<span>📊 总记录数: <span id="totalEntries">0</span></span>
<span>⏱️ 总学习时长: <span id="totalMinutes">0</span> 分钟</span>
<span class="storage-info" id="storageStatus">💾 数据已同步到本地</span>
</div>
<hr>
<div class="footer-note">
数据自动保存在浏览器本地存储中（localStorage），不会上传到服务器
<br /><br />
衡水体学习网@2026年
</div>
</div>
<script>
(function() {
// ========== 本地存储相关常量 ==========
const STORAGE_KEY = 'study_log_entries';
// DOM 元素
const textarea = document.getElementById('logInput');
const generateBtn = document.getElementById('generateChartBtn');
const clearDataBtn = document.getElementById('clearDataBtn');
const canvas = document.getElementById('studyChart');
const chartContainer = document.getElementById('chartContainer');
const fallbackMessage = document.getElementById('fallbackMessage');
const statsInfo = document.getElementById('statsInfo');
const totalEntriesSpan = document.getElementById('totalEntries');
const totalMinutesSpan = document.getElementById('totalMinutes');
const saveIndicator = document.getElementById('saveIndicator');
const storageStatus = document.getElementById('storageStatus');
let currentChart = null;
let saveTimeout = null;
// ========== 本地存储操作 ==========
function saveToLocalStorage(text) {
try {
localStorage.setItem(STORAGE_KEY, text);
return true;
} catch (e) {
console.warn('本地存储失败:', e);
return false;
}
}
function loadFromLocalStorage() {
try {
const saved = localStorage.getItem(STORAGE_KEY);
return saved !== null ? saved : '';
} catch (e) {
console.warn('读取本地存储失败:', e);
return '';
}
}
function clearLocalStorage() {
try {
localStorage.removeItem(STORAGE_KEY);
return true;
} catch (e) {
console.warn('清除本地存储失败:', e);
return false;
}
}
function showSaveIndicator() {
if (saveIndicator) {
saveIndicator.classList.add('visible');
clearTimeout(saveIndicator._hideTimeout);
saveIndicator._hideTimeout = setTimeout(() => {
saveIndicator.classList.remove('visible');
}, 2000);
}
}
function autoSave() {
clearTimeout(saveTimeout);
saveTimeout = setTimeout(() => {
const text = textarea.value;
const success = saveToLocalStorage(text);
if (success) {
showSaveIndicator();
if (storageStatus) {
storageStatus.textContent = '💾 数据已同步到本地';
storageStatus.style.color = '#00ffc3';
}
} else {
if (storageStatus) {
storageStatus.textContent = '⚠️ 保存失败，请检查空间';
storageStatus.style.color = '#ff6b7a';
}
}
}, 600);
}
// ========== 日志解析逻辑 ==========
function parseLogEntries(logText) {
if (!logText || !logText.trim()) {
return [];
}
const lines = logText.split(/\r?\n/).filter(line => line.trim() !== '');
const entries = [];
for (let line of lines) {
line = line.trim();
const normalizedLine = line.replace(/，/g, ',');
const parts = normalizedLine.split(',').map(s => s.trim()).filter(s => s.length > 0);
if (parts.length < 2) {
continue;
}
const rawDateStr = parts[0];
const minutePart = parts[1];
const minuteMatch = minutePart.match(/(\d+)/);
if (!minuteMatch) {
continue;
}
const minutes = parseInt(minuteMatch[1], 10);
if (isNaN(minutes) || minutes < 0) {
continue;
}
const formattedDate = parseChineseDate(rawDateStr);
if (!formattedDate) {
continue;
}
entries.push({
date: formattedDate,
minutes: minutes,
rawDate: rawDateStr
});
}
entries.sort((a, b) => a.date.localeCompare(b.date));
const mergedMap = new Map();
for (let entry of entries) {
if (mergedMap.has(entry.date)) {
mergedMap.get(entry.date).minutes += entry.minutes;
} else {
mergedMap.set(entry.date, {
date: entry.date,
minutes: entry.minutes,
rawDate: entry.rawDate
});
}
}
const mergedEntries = Array.from(mergedMap.values()).sort((a, b) => a.date.localeCompare(b.date));
return mergedEntries;
}
function parseChineseDate(dateStr) {
if (!dateStr) return null;
let str = dateStr.trim();
const chineseRegex = /(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/;
const matchChinese = str.match(chineseRegex);
if (matchChinese) {
const year = matchChinese[1];
const month = matchChinese[2].padStart(2, '0');
const day = matchChinese[3].padStart(2, '0');
return `${year}-${month}-${day}`;
}
const numericRegex = /(\d{4})[-\/]\s*(\d{1,2})[-\/]\s*(\d{1,2})/;
const matchNumeric = str.match(numericRegex);
if (matchNumeric) {
const year = matchNumeric[1];
const month = matchNumeric[2].padStart(2, '0');
const day = matchNumeric[3].padStart(2, '0');
return `${year}-${month}-${day}`;
}
const compactRegex = /(\d{4})(\d{2})(\d{2})/;
const matchCompact = str.match(compactRegex);
if (matchCompact && str.length >= 8) {
const year = matchCompact[1];
const month = matchCompact[2];
const day = matchCompact[3];
if (parseInt(month) >= 1 && parseInt(month) <= 12 && parseInt(day) >= 1 && parseInt(day) <= 31) {
return `${year}-${month}-${day}`;
}
}
return null;
}
// ========== 图表相关 ==========
function destroyChart() {
if (currentChart) {
currentChart.destroy();
currentChart = null;
}
}
function showFallbackMessage(text, isError = false) {
if (fallbackMessage) {
fallbackMessage.style.display = 'block';
fallbackMessage.textContent = text;
fallbackMessage.style.color = isError ? '#ff8a9a' : '#8b9ad0';
fallbackMessage.style.background = isError ? 'rgba(180,0,30,0.2)' : 'rgba(0,0,0,0.3)';
}
if (canvas) {
canvas.style.display = 'none';
}
if (statsInfo) {
statsInfo.style.display = 'none';
}
}
function showCanvas() {
if (fallbackMessage) {
fallbackMessage.style.display = 'none';
}
if (canvas) {
canvas.style.display = 'block';
}
}
function updateStats(entries) {
if (!statsInfo || !totalEntriesSpan || !totalMinutesSpan) return;
if (!entries || entries.length === 0) {
statsInfo.style.display = 'none';
return;
}
statsInfo.style.display = 'flex';
totalEntriesSpan.textContent = entries.length;
const totalMins = entries.reduce((sum, e) => sum + e.minutes, 0);
totalMinutesSpan.textContent = totalMins;
if (storageStatus) {
const savedText = loadFromLocalStorage();
if (savedText === textarea.value) {
storageStatus.textContent = '💾 数据已同步到本地';
storageStatus.style.color = '#00ffc3';
} else {
storageStatus.textContent = '📝 有未保存的修改';
storageStatus.style.color = '#ffb74d';
}
}
}
function renderChart(entries) {
destroyChart();
if (!entries || entries.length === 0) {
showFallbackMessage('暂无有效学习记录。请按格式输入日期与分钟数。', false);
updateStats([]);
return;
}
const labels = entries.map(entry => {
const dateObj = new Date(entry.date + 'T00:00:00');
if (isNaN(dateObj.getTime())) {
return entry.date;
}
const month = dateObj.getMonth() + 1;
const day = dateObj.getDate();
return `${month}月${day}日`;
});
const dataPoints = entries.map(entry => entry.minutes);
showCanvas();
const ctx = canvas.getContext('2d');
// 科技感图表配色
Chart.defaults.color = '#b0c8ff';
Chart.defaults.borderColor = 'rgba(0, 255, 255, 0.3)';
currentChart = new Chart(ctx, {
type: 'line',
data: {
labels: labels,
datasets: [{

function handleGenerateChart() {
const rawText = textarea.value;
saveToLocalStorage(rawText);
showSaveIndicator();
const entries = parseLogEntries(rawText);
if (entries.length === 0) {
destroyChart();
showFallbackMessage('没有识别到有效记录。请确保每行包含“日期，分钟”格式', false);
updateStats([]);
if (canvas) canvas.style.display = 'none';
return;
}
renderChart(entries);
}

);

if (result) {
clearLocalStorage();
textarea.value = '';
destroyChart();
showFallbackMessage('数据已清除。请重新输入学习记录。', false);

if (storageStatus) {

}
}

/**
* 自定义确认弹窗（替代原生 confirm）
* @param {string} message - 提示消息，支持 \n 换行
* @returns {Promise<boolean>} - 用户点击"确定"返回 true，点击"取消"返回 false
*/
function customConfirm(message) {
return new Promise((resolve) => {
// 创建遮罩层
const overlay = document.createElement('div');
overlay.className = 'custom-modal-overlay';
// 创建弹窗盒子
const box = document.createElement('div');
box.className = 'custom-modal-box';
box.innerHTML = `
<div class="custom-modal-icon">⚠️</div>
<div class="custom-modal-title">确认操作</div>
<div class="custom-modal-message">${message}</div>
<div class="custom-modal-buttons">
<button class="custom-modal-btn custom-modal-btn-cancel" id="modalCancel">取消</button>
<button class="custom-modal-btn custom-modal-btn-danger" id="modalConfirm">确认清除</button>
</div>
`;
overlay.appendChild(box);
document.body.appendChild(overlay);
// 绑定按钮事件
const confirmBtn = box.querySelector('#modalConfirm');
const cancelBtn = box.querySelector('#modalCancel');
function closeModal(result) {
overlay.style.opacity = '0';
overlay.style.transition = 'opacity 0.2s ease';
setTimeout(() => {
overlay.remove();
}, 200);
resolve(result);
}
confirmBtn.addEventListener('click', () => closeModal(true));
cancelBtn.addEventListener('click', () => closeModal(false));
// 点击遮罩层关闭（视为取消）
overlay.addEventListener('click', (e) => {
if (e.target === overlay) {
closeModal(false);
}
});
// 按 ESC 键关闭（视为取消）
const escHandler = (e) => {
if (e.key === 'Escape') {
closeModal(false);
document.removeEventListener('keydown', escHandler);
}
};
document.addEventListener('keydown', escHandler);
});
}
